name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get install -y cmake ninja-build lua5.4 liblua5.4-dev
      - name: Configure
        run: cmake --preset debug
      - name: Build
        run: cmake --build --preset debug
      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build/debug/_deps
          key: deps-${{ hashFiles('CMakeLists.txt', 'engine/CMakeLists.txt') }}
      - name: Test
        run: ctest --preset debug --output-on-failure

